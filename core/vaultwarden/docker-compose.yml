services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - DOMAIN=${VAULTWARDEN_DOMAIN}
      - SIGNUPS_ALLOWED=${SIGNUPS_ALLOWED:-false}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - WEBSOCKET_ENABLED=true
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - ${VAULTWARDEN_DATA_DIR:-./vw-data}:/data
    # ports:
    #   - "${VAULTWARDEN_PORT:-127.0.0.1:8083}:80"  # Not published: reached via proxy_net through Nginx Proxy Manager, not a host port. Uncomment only for local/debug access.
