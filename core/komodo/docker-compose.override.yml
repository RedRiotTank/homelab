services:
  komodo:
    ports:
      # Binds the dashboard to localhost for initial configuration or emergency access
      - "${KOMODO_PORT:-127.0.0.1:9120}:9120"
    networks:
      - proxy_net
      - monitoring_net
    labels:
      logging_jobname: "komodo"
      logging: "komodo"

  komodo-mongo:
    labels:
      logging_jobname: "komodo-mongo"
      logging: "komodo"

networks:
  proxy_net:
    external: true
  monitoring_net:
    external: true
    name: monitoring
