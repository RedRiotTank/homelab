services:
  headscale:
    image: headscale/headscale:stable
    container_name: headscale
    restart: unless-stopped
    command: serve
    volumes:
      - ${HOST_CONFIG_PATH:-/opt/core/headscale/config}:/etc/headscale
      - headscale_data:/var/lib/headscale
    networks:
      - headscale_internal

  headplane:
    image: ghcr.io/tale/headplane:latest
    container_name: headplane
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HEADPLANE_CONFIG_DIR:-/opt/core/headscale/headplane-config}/config.yaml:/etc/headplane/config.yaml
    networks:
      - headscale_internal

volumes:
  headscale_data:
    name: headscale_data

networks:
  headscale_internal:
    name: headscale_internal
