version: '3.8'

services:
  headscale:
    image: headscale/headscale:stable
    container_name: headscale
    restart: unless-stopped
    command: serve
    volumes:
      - ${HEADSCALE_CONFIG_DIR:-./config}:/etc/headscale
      - ${HEADSCALE_DATA_DIR:-./data}:/var/lib/headscale
    networks:
      - proxy_net

  headplane:
    image: ghcr.io/tale/headplane:latest
    container_name: headplane
    restart: unless-stopped
    volumes:
        - /var/run/docker.sock:/var/run/docker.sock:ro
        - ${HEADPLANE_CONFIG_DIR:-./headplane-config/config.yaml}:/etc/headplane/config.yaml
      ports:
        - "3001:3000"
      networks:
        - proxy_net

networks:
  proxy_net:
    external: true
