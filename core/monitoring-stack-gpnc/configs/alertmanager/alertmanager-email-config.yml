# Generic SMTP/email notification template.
#
# Copy this file to a private location, fill in the SMTP server and
# credentials, and point ALERTMANAGER_CONFIG_FILE at it. Use an app-specific
# password where your provider supports it. Do not commit real credentials.
#
# Works with any standard SMTP provider: your mail host, Fastmail, Gmail
# (app password), SendGrid, Mailgun, etc.

global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'Alertmanager <alertmanager@example.com>'
  smtp_auth_username: 'alertmanager@example.com'
  smtp_auth_password: 'REPLACE_WITH_SMTP_PASSWORD'
  smtp_require_tls: true
  smtp_hello: 'alertmanager'

route:
  group_by: ['alertname', 'instance', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: email

receivers:
  - name: email
    email_configs:
      - to: 'you@example.com'
        send_resolved: true
