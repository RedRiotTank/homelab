global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    namespace: local

rule_files:
  - /etc/prometheus/recording-rules.yml
  - /etc/prometheus/alerting-rules.yml

alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [ 'localhost:9090' ]
        labels:
          container: 'prometheus'
          instance: 'primary'
          node: 'primary'

  - job_name: alertmanager
    static_configs:
      - targets: [ 'alertmanager:9093' ]
        labels:
          container: 'alertmanager'
          instance: 'primary'
          node: 'primary'

  # Local exporters plus any remote edge-node exporters listed in
  # /etc/prometheus/targets/node-exporter.yml. That file is local and is not
  # committed; see targets/README.md.
  - job_name: node-exporter
    static_configs:
      - targets: [ 'node-exporter:9100' ]
        labels:
          container: 'node-exporter'
          instance: 'primary'
          node: 'primary'
    file_sd_configs:
      - files: [ '/etc/prometheus/targets/node-exporter.yml' ]

  - job_name: cadvisor
    static_configs:
      - targets: [ 'cadvisor:8080' ]
        labels:
          container: 'cadvisor'
          instance: 'primary'
          node: 'primary'
    file_sd_configs:
      - files: [ '/etc/prometheus/targets/cadvisor.yml' ]

  - job_name: backrest
    static_configs:
      - targets: [ 'backrest-exporter:9797' ]
        labels:
          instance: 'primary'
          node: 'primary'

  - job_name: backrest-verify
    static_configs:
      - targets: [ 'backrest-verify:9798' ]
        labels:
          instance: 'primary'
          node: 'primary'
