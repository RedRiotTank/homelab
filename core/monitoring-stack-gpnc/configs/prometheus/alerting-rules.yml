groups:
- name: node-exporter
  rules:
  - alert: NodeOutOfMemory
    annotations:
      summary: Node out of memory (instance {{ $labels.instance }})
      description: "Node memory is filling up (< 10% left)\n  VALUE = {{ $value }}"
    labels:
      severity: warning
    expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100 < 10) * on(instance) group_left (nodename) node_uname_info{nodename=~".+"}
    for: 2m

  - alert: NodeMemoryUnderMemoryPressure
    annotations:
      summary: Node memory under memory pressure (instance {{ $labels.instance }})
      description: "The node is under heavy memory pressure. High rate of major page faults\n  VALUE = {{ $value }}"
    labels:
      severity: warning
    expr: (rate(node_vmstat_pgmajfault[1m]) > 1000) * on(instance) group_left (nodename) node_uname_info{nodename=~".+"}
    for: 2m

  - alert: NodeDown
    annotations:
      summary: "Node exporter on {{ $labels.instance }} is down"
      description: "Prometheus has been unable to scrape node-exporter on {{ $labels.instance }} (job {{ $labels.job }}) for more than 2 minutes."
    labels:
      severity: critical
    expr: up{job="node-exporter"} == 0
    for: 2m

  - alert: NodeHighCpuUsage
    annotations:
      summary: "Node CPU usage is high on {{ $labels.instance }}"
      description: "CPU usage on {{ $labels.instance }} has been above 90% for more than 10 minutes.\nVALUE = {{ printf \"%.1f\" $value }}%"
    labels:
      severity: warning
    expr: (100 - (avg by (instance, node) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 90
    for: 10m

  - alert: NodeHighMemoryUsage
    annotations:
      summary: "Node memory usage is high on {{ $labels.instance }}"
      description: "Memory usage on {{ $labels.instance }} has been above 90% for more than 10 minutes.\nVALUE = {{ printf \"%.1f\" $value }}%"
    labels:
      severity: warning
    expr: (100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))) > 90
    for: 10m

  - alert: NodeFilesystemSpaceFillingUp
    annotations:
      description: "Filesystem on {{ $labels.device }} at {{ $labels.instance }} has only {{ printf \"%.2f\" $value }}% available space left and is filling up."
      summary: "Filesystem is predicted to run out of space within the next 24 hours."
    expr: |
      (
        node_filesystem_avail_bytes{job="node-exporter",fstype!=""} / node_filesystem_size_bytes{job="node-exporter",fstype!=""} * 100 < 40
      and
        predict_linear(node_filesystem_avail_bytes{job="node-exporter",fstype!=""}[6h], 24*60*60) < 0
      and
        node_filesystem_readonly{job="node-exporter",fstype!=""} == 0
      )
    for: 1h
    labels:
      severity: warning
  - alert: NodeFilesystemSpaceFillingUp
    annotations:
      description: "Filesystem on {{ $labels.device }} at {{ $labels.instance }} has only {{ printf \"%.2f\" $value }}% available space left and is filling up fast."
      summary: "Filesystem is predicted to run out of space within the next 4 hours."
    expr: |
      (
        node_filesystem_avail_bytes{job="node-exporter",fstype!=""} / node_filesystem_size_bytes{job="node-exporter",fstype!=""} * 100 < 20
      and
        predict_linear(node_filesystem_avail_bytes{job="node-exporter",fstype!=""}[6h], 4*60*60) < 0
      and
        node_filesystem_readonly{job="node-exporter",fstype!=""} == 0
      )
    for: 1h
    labels:
      severity: critical
  - alert: NodeFilesystemAlmostOutOfSpace
    annotations:
      description: "Filesystem on {{ $labels.device }} at {{ $labels.instance }} has only {{ printf \"%.2f\" $value }}% available space left."
      summary: "Filesystem has less than 5% space left."
    expr: |
      (
        node_filesystem_avail_bytes{job="node-exporter",fstype!=""} / node_filesystem_size_bytes{job="node-exporter",fstype!=""} * 100 < 5
      and
        node_filesystem_readonly{job="node-exporter",fstype!=""} == 0
      )
    for: 10m
    labels:
      severity: warning
  - alert: NodeFilesystemAlmostOutOfSpace
    annotations:
      description: "Filesystem on {{ $labels.device }} at {{ $labels.instance }} has only {{ printf \"%.2f\" $value }}% available space left."
      summary: "Filesystem has less than 3% space left."
    expr: |
      (
        node_filesystem_avail_bytes{job="node-exporter",fstype!=""} / node_filesystem_size_bytes{job="node-exporter",fstype!=""} * 100 < 3
      and
        node_filesystem_readonly{job="node-exporter",fstype!=""} == 0
      )
    for: 10m
    labels:
      severity: critical
  - alert: NodeFilesystemFilesFillingUp
    annotations:
      description: "Filesystem on {{ $labels.device }} at {{ $labels.instance }} has only {{ printf \"%.2f\" $value }}% available inodes left and is filling up."
      summary: "Filesystem is predicted to run out of inodes within the next 24 hours."
    expr: |
      (
        node_filesystem_files_free{job="node-exporter",fstype!=""} / node_filesystem_files{job="node-exporter",fstype!=""} * 100 < 40
      and
        predict_linear(node_filesystem_files_free{job="node-exporter",fstype!=""}[6h], 24*60*60) < 0
      and
        node_filesystem_readonly{job="node-exporter",fstype!=""} == 0
      )
    for: 1h
    labels:
      severity: warning
  - alert: NodeFilesystemFilesFillingUp
    annotations:
      description: "Filesystem on {{ $labels.device }} at {{ $labels.instance }} has only {{ printf \"%.2f\" $value }}% available inodes left and is filling up fast."
      summary: "Filesystem is predicted to run out of inodes within the next 4 hours."
    expr: |
      (
        node_filesystem_files_free{job="node-exporter",fstype!=""} / node_filesystem_files{job="node-exporter",fstype!=""} * 100 < 20
      and
        predict_linear(node_filesystem_files_free{job="node-exporter",fstype!=""}[6h], 4*60*60) < 0
      and
        node_filesystem_readonly{job="node-exporter",fstype!=""} == 0
      )
    for: 1h
    labels:
      severity: critical
  - alert: NodeFilesystemAlmostOutOfFiles
    annotations:
      description: "Filesystem on {{ $labels.device }} at {{ $labels.instance }} has only {{ printf \"%.2f\" $value }}% available inodes left."
      summary: "Filesystem has less than 5% inodes left."
    expr: |
      (
        node_filesystem_files_free{job="node-exporter",fstype!=""} / node_filesystem_files{job="node-exporter",fstype!=""} * 100 < 5
      and
        node_filesystem_readonly{job="node-exporter",fstype!=""} == 0
      )
    for: 1h
    labels:
      severity: warning
  - alert: NodeFilesystemAlmostOutOfFiles
    annotations:
      description: "Filesystem on {{ $labels.device }} at {{ $labels.instance }} has only {{ printf \"%.2f\" $value }}% available inodes left."
      summary: "Filesystem has less than 3% inodes left."
    expr: |
      (
        node_filesystem_files_free{job="node-exporter",fstype!=""} / node_filesystem_files{job="node-exporter",fstype!=""} * 100 < 3
      and
        node_filesystem_readonly{job="node-exporter",fstype!=""} == 0
      )
    for: 1h
    labels:
      severity: critical
  - alert: NodeNetworkReceiveErrs
    annotations:
      description: "{{ $labels.instance }} interface {{ $labels.device }} has encountered {{ printf \"%.0f\" $value }} receive errors in the last two minutes."
      summary: "Network interface is reporting many receive errors."
    expr: |
      rate(node_network_receive_errs_total[2m]) / rate(node_network_receive_packets_total[2m]) > 0.01
    for: 1h
    labels:
      severity: warning
  - alert: NodeNetworkTransmitErrs
    annotations:
      description: "{{ $labels.instance }} interface {{ $labels.device }} has encountered {{ printf \"%.0f\" $value }} transmit errors in the last two minutes."
      summary: "Network interface is reporting many transmit errors."
    expr: |
      rate(node_network_transmit_errs_total[2m]) / rate(node_network_transmit_packets_total[2m]) > 0.01
    for: 1h
    labels:
      severity: warning
  - alert: "NodeHighNumberConntrackEntriesUsed"
    annotations:
      description: "{{ $value | humanizePercentage }} of conntrack entries are used."
      summary: "Number of conntrack are getting close to the limit."
    expr: |
      (node_nf_conntrack_entries / node_nf_conntrack_entries_limit) > 0.75
    labels:
      severity: warning
  - alert: NodeTextFileCollectorScrapeError
    annotations:
      description: "Node Exporter text file collector failed to scrape."
      summary: "Node Exporter text file collector failed to scrape."
    expr: |
      node_textfile_scrape_error{job="node-exporter"} == 1
    labels:
      severity: warning
  - alert: NodeClockSkewDetected
    annotations:
      description: "Clock on {{ $labels.instance }} is out of sync by more than 300s. Ensure NTP is configured correctly on this host."
      summary: "Clock skew detected."
    expr: |
      (
        node_timex_offset_seconds > 0.05
      and
        deriv(node_timex_offset_seconds[5m]) >= 0
      )
      or
      (
        node_timex_offset_seconds < -0.05
      and
        deriv(node_timex_offset_seconds[5m]) <= 0
      )
    for: 10m
    labels:
      severity: warning
  - alert: NodeClockNotSynchronising
    annotations:
      description: "Clock on {{ $labels.instance }} is not synchronising. Ensure NTP is configured on this host."
      summary: "Clock not synchronising."
    expr: |
      min_over_time(node_timex_sync_status[5m]) == 0
      and
      node_timex_maxerror_seconds >= 16
    for: 10m
    labels:
      severity: warning
  - alert: NodeRAIDDegraded
    annotations:
      description: "RAID array '{{ $labels.device }}' on {{ $labels.instance }} is in degraded state due to one or more disks failures. Number of spare drives is insufficient to fix issue automatically."
      summary: "RAID Array is degraded"
    expr: |
      node_md_disks_required - ignoring (state) (node_md_disks{state="active"}) > 0
    for: 15m
    labels:
      severity: critical
  - alert: NodeRAIDDiskFailure
    annotations:
      description: "At least one device in RAID array on {{ $labels.instance }} failed. Array '{{ $labels.device }}' needs attention and possibly a disk swap."
      summary: "Failed device in RAID array"
    expr: node_md_disks{state="failed"} > 0
    labels:
      severity: warning

- name: cadvisor
  rules:
  - alert: ContainerMemoryUsageHigh
    annotations:
      summary: "Container {{ $labels.name }} memory usage is high"
      description: "The container {{ $labels.name }} on instance {{ $labels.instance }} is using more than 80% of its allocated memory.\nVALUE = {{ $value }}"
    expr: container_memory_working_set_bytes{name=~".+"} / (container_spec_memory_limit_bytes{name=~".+"} > 0) > 0.8
    for: 5m
    labels:
      severity: warning

  - alert: ContainerMemoryAlmostOut
    annotations:
      summary: "Container {{ $labels.name }} memory almost full"
      description: "The container {{ $labels.name }} on instance {{ $labels.instance }} is using more than 90% of its allocated memory.\nVALUE = {{ $value }}"
    expr: container_memory_working_set_bytes{name=~".+"} / (container_spec_memory_limit_bytes{name=~".+"} > 0) > 0.9
    for: 2m
    labels:
      severity: critical

  - alert: ContainerCPUThrottlingHigh
    annotations:
      summary: "Container {{ $labels.name }} experiencing high CPU throttling"
      description: "The container {{ $labels.name }} on instance {{ $labels.instance }} is experiencing high CPU throttling.\nVALUE = {{ $value }}"
    expr: (rate(container_cpu_cfs_throttled_periods_total{name=~".+"}[5m]) / rate(container_cpu_cfs_periods_total{name=~".+"}[5m]) > 0.2) and on(instance, name) (container_spec_cpu_quota{name=~".+"} > 0)
    for: 5m
    labels:
      severity: warning

  - alert: ContainerCPUUsageHigh
    annotations:
      summary: "Container {{ $labels.name }} CPU usage is high"
      description: "The container {{ $labels.name }} on instance {{ $labels.instance }} is using more than 80% of its allocated CPU.\nVALUE = {{ $value }}"
    expr: (rate(container_cpu_usage_seconds_total{name=~".+"}[5m]) > (container_spec_cpu_quota{name=~".+"} / container_spec_cpu_period{name=~".+"}) * 0.8) and on(instance, name) (container_spec_cpu_quota{name=~".+"} > 0)
    for: 5m
    labels:
      severity: warning

- name: backrest
  rules:
  - alert: BackrestDown
    annotations:
      summary: "Backrest exporter/API is down"
      description: "Prometheus has been unable to read Backrest status for more than 5 minutes."
    labels:
      severity: critical
    expr: up{job="backrest"} == 0 or backrest_up == 0
    for: 5m

  - alert: BackrestBackupFailed
    annotations:
      summary: "Backup failed: {{ $labels.plan_id }}"
      description: "The last Backrest backup for plan {{ $labels.plan_id }} on repo {{ $labels.repo_id }} failed."
    labels:
      severity: critical
    expr: backrest_plan_last_backup_failed == 1
    for: 5m

  - alert: BackrestBackupMissing
    annotations:
      summary: "No successful backup: {{ $labels.plan_id }}"
      description: "Backrest has no successful backup in its 30-day history for plan {{ $labels.plan_id }} on repo {{ $labels.repo_id }}."
    labels:
      severity: warning
    expr: backrest_plan_no_backup == 1
    for: 15m

  - alert: BackrestBackupStale
    annotations:
      summary: "Backup is stale: {{ $labels.plan_id }}"
      description: "The last successful backup for plan {{ $labels.plan_id }} on repo {{ $labels.repo_id }} is older than the configured threshold (default 36 hours)."
    labels:
      severity: warning
    expr: backrest_plan_stale == 1
    for: 10m

  - alert: BackrestBackupCompleted
    annotations:
      summary: "Backup completed: {{ $labels.plan_id }}"
      description: "Backrest recorded a successful backup for plan {{ $labels.plan_id }} on repo {{ $labels.repo_id }}."
    labels:
      severity: info
    expr: changes(backrest_plan_last_success_timestamp_seconds[10m]) > 0
    for: 1m

- name: backup-verification
  rules:
  - alert: BackupRepoCheckFailed
    annotations:
      summary: "Repository check failed: {{ $labels.repo_id }}"
      description: "The last restic check for repository {{ $labels.repo_id }} failed. Backups may still run, but repository integrity is not proven."
    labels:
      severity: critical
    expr: backrest_repo_last_check_failed == 1
    for: 5m

  - alert: BackupRepoCheckStale
    annotations:
      summary: "Repository check is stale: {{ $labels.repo_id }}"
      description: "The last completed restic check for repository {{ $labels.repo_id }} is older than 40 days."
    labels:
      severity: warning
    expr: |
      (time() - backrest_repo_last_check_timestamp_seconds) > 40 * 24 * 3600
      and
      backrest_repo_last_check_timestamp_seconds > 0
    for: 6h

  - alert: BackupRepoCheckNeverRan
    annotations:
      summary: "Repository has never been checked: {{ $labels.repo_id }}"
      description: "Backrest has no completed restic check recorded for repository {{ $labels.repo_id }}."
    labels:
      severity: warning
    expr: backrest_repo_last_check_timestamp_seconds == 0
    for: 1h

  - alert: BackupVerificationDown
    annotations:
      summary: "Backup verification service is down"
      description: "Prometheus has not scraped the backrest-verify service for more than 10 minutes."
    labels:
      severity: critical
    expr: |
      up{job="backrest-verify"} == 0
      or
      absent(up{job="backrest-verify"})
    for: 10m

  - alert: BackupVerificationFailed
    annotations:
      summary: "Monthly restore drill failed"
      description: "The last restore verification drill failed. Open Telegram /verify or the backrest-verify report for the failed checks."
    labels:
      severity: critical
    expr: |
      backrest_verify_success == 0
      and
      backrest_verify_last_run_timestamp_seconds > 0
    for: 5m

  - alert: BackupVerificationOverdue
    annotations:
      summary: "Restore drill is overdue"
      description: "No restore verification drill has run for more than 35 days."
    labels:
      severity: warning
    expr: |
      (time() - backrest_verify_last_run_timestamp_seconds) > 35 * 24 * 3600
      and
      backrest_verify_last_run_timestamp_seconds > 0
    for: 6h

  - alert: BackupVerificationNeverRan
    annotations:
      summary: "Restore drill has never run"
      description: "The backrest-verify service has no recorded drill run."
    labels:
      severity: warning
    expr: backrest_verify_last_run_timestamp_seconds == 0
    for: 24h

  - alert: BackupVerificationCompleted
    annotations:
      summary: "Restore drill completed"
      description: "A restore verification drill finished successfully. Open Telegram /verify for restored size and snapshot details."
    labels:
      severity: info
    expr: changes(backrest_verify_last_success_timestamp_seconds[10m]) > 0
    for: 1m

