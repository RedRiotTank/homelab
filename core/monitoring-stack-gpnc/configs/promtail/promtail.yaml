server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      
      - source_labels: ['__meta_docker_container_label_logging_jobname']
        target_label: 'job'
      
      - source_labels: ['__meta_docker_container_label_logging_jobname', '__meta_docker_container_label_com_docker_compose_project']
        regex: '^;(.+)'
        target_label: 'job'
        replacement: '$1'
        
    pipeline_stages:
      - docker: {}
      
      - multiline:
          firstline: '^\d{4}-\d{2}-\d{2} \d{1,2}:\d{2}:\d{2},\d{3}'
          max_wait_time: 3s
