services:
  nginx-proxy:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - '${NPM_HTTP_PORT:-80}:80'
      - '${NPM_HTTPS_PORT:-443}:443'
      - '${NPM_ADMIN_PORT:-81}:81'
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - proxy_net

  cloudflare-ddns:
    image: oznu/cloudflare-ddns:latest
    container_name: cloudflare-ddns
    restart: unless-stopped
    environment:
      - API_KEY=${CF_API_TOKEN}
      - ZONE=${CF_ZONE}
      - PROXIED=${CF_PROXIED:-false}
      - CRON=${CF_CRON:-*/5 * * * *}
    networks:
      - proxy_net

volumes:
  npm_data:
    name: npm_data
  npm_letsencrypt:
    name: npm_letsencrypt

networks:
  proxy_net:
    external: true
