services:
  backrest:
    image: ghcr.io/garethgeorge/backrest:latest
    cpus: 1
    mem_limit: 1g
    container_name: backrest
    restart: unless-stopped
    ports:
      - "${BACKREST_PORT:-127.0.0.1:9898}:9898/tcp"
    environment:
      - BACKREST_DATA=/data
      - BACKREST_CONFIG=/config/config.json
      - XDG_CACHE_HOME=/cache
      - TMPDIR=/tmp
      - TZ=${TZ:-UTC}
      # Host paths used by the collect-config.sh pre-backup hook.
      - HOST_HOME_DIR=${HOST_HOME_DIR:-/home/deployer}
      - HOST_ETC_DIR=${HOST_ETC_DIR:-/etc}
    volumes:
      # Internal state, cache and config
      - backrest_data:/data
      - backrest_config:/config
      - backrest_cache:/cache
      - backrest_tmp:/tmp

      # Cloud storage credentials (rclone)
      - "${HOST_RCLONE_CONFIG_DIR:-/path/to/.config/rclone}:/root/.config/rclone:ro"

      # Backup sources (read-only)
      - "${HOST_HOMELAB_DIR:-/path/to/homelab}:/backup/homelab:ro"
      - "${HOST_DOCKER_VOLUMES_DIR:-/var/lib/docker/volumes}:/backup/docker_volumes:ro"
      - "${HOST_OPT_DIR:-/opt}:/backup/opt:ro"
      - "${HOST_SRV_DIR:-/srv}:/backup/srv:ro"

      # Docker socket (enables container inspection and pre-backup hooks)
      - "${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro"

      # Versioned helper scripts (dbdump.sh, collect-config.sh)
      - ./scripts:/data/scripts:ro

      # Destination storage repository (read-write for snapshots)
      - "${BACKREST_REPO_DIR:-/mnt/backups}:/repos/external:rw"

  backrest-exporter:
    image: python:3.12-alpine
    cpus: 0.25
    mem_limit: 128m
    container_name: backrest-exporter
    restart: unless-stopped
    command:
      - python
      - /app/backrest-exporter.py
    environment:
      - BACKREST_URL=http://backrest:9898
      - BACKREST_EXPORTER_USER=${BACKREST_EXPORTER_USER:-prometheus}
      - BACKREST_EXPORTER_PASSWORD=${BACKREST_EXPORTER_PASSWORD}
      - BACKREST_STALE_SECONDS=${BACKREST_STALE_SECONDS:-129600}
      - REFRESH_SECONDS=${BACKREST_REFRESH_SECONDS:-60}
    volumes:
      - ./backrest-exporter.py:/app/backrest-exporter.py:ro
    depends_on:
      - backrest

  backrest-verify:
    build:
      context: ./verify
    image: ${BACKREST_VERIFY_IMAGE:-backrest-verify:local}
    container_name: backrest-verify
    restart: unless-stopped
    cpus: 1
    mem_limit: 1g
    environment:
      - TZ=${TZ:-UTC}
      - BACKREST_URL=http://backrest:9898
      - BACKREST_EXPORTER_USER=${BACKREST_EXPORTER_USER:-prometheus}
      - BACKREST_EXPORTER_PASSWORD=${BACKREST_EXPORTER_PASSWORD}
      - BACKREST_CONFIG=/config/config.json
      - BACKREST_REPO_DIR=/repos/external
      - BACKREST_VERIFY_STATE_DIR=/verify/state
      - BACKREST_VERIFY_SCRATCH_DIR=/verify/scratch
      - BACKREST_VERIFY_RCLONE_CONFIG=/rclone/rclone.conf
      - BACKREST_VERIFY_ENABLED=${BACKREST_VERIFY_ENABLED:-true}
      - BACKREST_VERIFY_DAY=${BACKREST_VERIFY_DAY:-16}
      - BACKREST_VERIFY_HOUR=${BACKREST_VERIFY_HOUR:-4}
      - BACKREST_VERIFY_MINUTE=${BACKREST_VERIFY_MINUTE:-0}
      - BACKREST_VERIFY_TIMEZONE=${BACKREST_VERIFY_TIMEZONE:-Europe/Madrid}
      - BACKREST_VERIFY_REMOTE_ROTATION=${BACKREST_VERIFY_REMOTE_ROTATION:-GDrive-RedServer,miixzify}
      - BACKREST_VERIFY_READ_DATA_PERCENT=${BACKREST_VERIFY_READ_DATA_PERCENT:-10}
      - BACKREST_VERIFY_MIN_FREE_GB=${BACKREST_VERIFY_MIN_FREE_GB:-40}
      - BACKREST_VERIFY_MAX_SNAPSHOT_AGE_HOURS=${BACKREST_VERIFY_MAX_SNAPSHOT_AGE_HOURS:-36}
      - BACKREST_VERIFY_HEAVY_PATHS=${BACKREST_VERIFY_HEAVY_PATHS:-/backup/srv/nextcloud_data,/backup/opt/minecraft_servers,/backup/docker_volumes/appflowy_minio_data}
      - BACKREST_VERIFY_MAX_RETRIES=${BACKREST_VERIFY_MAX_RETRIES:-3}
      - BACKREST_VERIFY_RETRY_HOURS=${BACKREST_VERIFY_RETRY_HOURS:-24}
      - BACKREST_VERIFY_KEEP_REPORTS=${BACKREST_VERIFY_KEEP_REPORTS:-12}
      - BACKREST_VERIFY_PORT=${BACKREST_VERIFY_PORT:-9798}
    volumes:
      - backrest_config:/config:ro
      - ${BACKREST_REPO_DIR:-/srv/backups}:/repos/external:ro
      - ${HOST_RCLONE_CONFIG_DIR:-/home/deployer/.config/rclone}:/rclone:ro
      - ${HOST_BACKREST_VERIFY_SCRATCH_DIR:-/var/tmp/backrest-verify}:/verify/scratch
      - backrest_verify_data:/verify/state
    depends_on:
      - backrest

volumes:
  backrest_data:
    name: backrest_data
  backrest_config:
    name: backrest_config
  backrest_cache:
    name: backrest_cache
  backrest_tmp:
    name: backrest_tmp
  backrest_verify_data:
    name: backrest_verify_data
