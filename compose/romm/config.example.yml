# Optional configuration for a library with a local gamelist.xml.
# Copy to ${RETRO_DATA_DIR}/config/config.yml on the host.
filesystem:
  # Rely on the gamelist instead of hashing every ROM on each scan, which is
  # slow for large libraries or network mounts.
  skip_hash_calculation: true
  skip_title_id_extraction: true

scan:
  # Metadata and covers come from the local gamelist.xml/covers.
  # With ScreenScraper/IGDB unset, scanning makes no external requests.
  priority:
    metadata:
      - gamelist
    artwork:
      - gamelist
  media:
    - box2d
  gamelist:
    export: false
