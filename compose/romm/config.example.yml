# Recommended configuration for the library generated from the rclone mount.
# Copy to ${RETRO_DATA_DIR}/config/config.yml on the host.
filesystem:
  # Do not read the ROMs to compute hashes: the gamelist makes it unnecessary,
  # and reading 29 GB from Usenet on every scan would be very slow.
  skip_hash_calculation: true
  skip_title_id_extraction: true

scan:
  # Metadata and covers come from the local gamelist.xml/covers.
  # With ScreenScraper/IGDB unset, scanning makes no external requests.
  priority:
    metadata:
      - gamelist
    artwork:
      - gamelist
  media:
    - box2d
  gamelist:
    export: false
