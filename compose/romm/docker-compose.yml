version: "3.8"

services:
  romm:
    image: rommapp/romm:latest
    container_name: romm
    restart: unless-stopped
    environment:
      - DB_HOST=romm-db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWD=${DB_PASSWORD}
      - ROMM_AUTH_SECRET_KEY=${ROMM_SECRET_KEY}
      - IGNORE_AUTH=${IGNORE_AUTH}
      - STEAMGRIDDB_API_KEY=${STEAMGRIDDB_API_KEY}
      - ROMM_BASE_URL=${ROMM_BASE_URL}
    ports:
      - "${ROMM_PORT}:8080"
    volumes:
      - ${RETRO_DATA_DIR}/resources:/romm/resources
      - ${ROM_LIBRARY_DIR}:/romm/library
      - ${RETRO_DATA_DIR}/assets:/romm/assets
      - ${RETRO_DATA_DIR}/config:/romm/config
    depends_on:
      - romm-db
    networks:
      - retro-internal

  romm-db:
    image: mariadb:latest
    container_name: romm-db
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${DB_NAME}
      - MARIADB_USER=${DB_USER}
      - MARIADB_PASSWORD=${DB_PASSWORD}
    volumes:
      - ${RETRO_DATA_DIR}/database:/var/lib/mysql
    networks:
      - retro-internal

networks:
  retro-internal:
