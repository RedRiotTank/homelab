services:
  romm:
    image: rommapp/romm:latest
    container_name: romm
    restart: unless-stopped
    environment:
      - DB_HOST=romm-db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWD=${DB_PASSWORD}
      - ROMM_AUTH_SECRET_KEY=${ROMM_AUTH_SECRET_KEY}
      - IGNORE_AUTH=${IGNORE_AUTH}
      - STEAMGRIDDB_API_KEY=${STEAMGRIDDB_API_KEY}
      # No ScreenScraper: metadata and covers come from the local gamelist.xml
      - ROMM_BASE_URL=${ROMM_BASE_URL}
      # Container timezone (RomM cron jobs use this local time)
      - TZ=${TZ:-UTC}
      # Scheduled rescan: each server decides whether to enable it and when
      - ENABLE_SCHEDULED_RESCAN=${ENABLE_SCHEDULED_RESCAN:-false}
      - SCHEDULED_RESCAN_CRON=${SCHEDULED_RESCAN_CRON:-0 3 * * *}
    ports:
      - "${ROMM_PORT:-8082}:8080"
    volumes:
      - ${RETRO_DATA_DIR:-/opt/compose/romm}/resources:/romm/resources
      # Generated library: symlinks to the rclone ROMs + gamelist.xml/covers
      - ${ROMM_LIBRARY_DIR:-/opt/compose/romm/library}:/romm/library/roms
      # Full rclone mount: the symlinks point at /mnt/media/...
      - ${RCLONE_MOUNT_DIR:-/mnt/media}:/mnt/media:ro
      - ${RETRO_DATA_DIR:-/opt/compose/romm}/assets:/romm/assets
      - ${RETRO_DATA_DIR:-/opt/compose/romm}/config:/romm/config
    depends_on:
      - romm-db
    networks:
      - retro-internal

  romm-db:
    image: mariadb:latest
    container_name: romm-db
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${DB_NAME}
      - MARIADB_USER=${DB_USER}
      - MARIADB_PASSWORD=${DB_PASSWORD}
    volumes:
      - ${RETRO_DATA_DIR:-/opt/compose/romm}/database:/var/lib/mysql
    networks:
      - retro-internal

networks:
  retro-internal:
