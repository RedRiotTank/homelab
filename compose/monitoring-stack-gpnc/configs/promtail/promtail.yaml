server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: flog_scrape
    static_configs:
      - targets:
          - localhost
        labels:
          job: flog_scrape
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            log: log
            stream: stream
            attrs: attrs
            tag: tag
      - regex:
          expression: '^/var/lib/docker/containers/(?P<container_id>[a-f0-9]+)/.*'
          source: filename
      - labels:
          stream:
          container_id:
      - multiline:
          firstline: ^\d{4}-\d{2}-\d{2} \d{1,2}:\d{2}:\d{2},\d{3}
          max_wait_time: 3s
      - json:
          expressions:
            level: level
