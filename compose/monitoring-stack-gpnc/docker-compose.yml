version: '3.8'

x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "1m"
    max-file: "1"
    tag: "{{.Name}}"

x-common-labels: &default-labels
  logging: "promtail"
  logging_jobname: "monitoring"
  stackname: "docker-monitoring-stack-gpnc"

services:
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.0.0}
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL}
      - GF_SERVER_DOMAIN=${GRAFANA_DOMAIN}
      - GF_SERVER_APP_URL=grafana://auth/login/oauth
      - GF_USERS_DEFAULT_THEME=light
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=critical
      - GF_PANELS_ENABLE_ALPHA=true
      - GF_FEATURE_TOGGLES_ENABLE=accessControlOnCall lokiLogsDataplane
      - GF_INSTALL_PLUGINS=grafana-polystat-panel
    volumes:
      - ./configs/grafana/provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/provisioning-dashboards.yaml:ro
      - ./configs/grafana/provisioning/datasources.yml:/etc/grafana/provisioning/datasources/provisioning-datasources.yaml:ro
      - ./dashboards/node-metrics.json:/var/lib/grafana/dashboards/node-metrics.json:ro
      - ./dashboards/container-metrics.json:/var/lib/grafana/dashboards/container-metrics.json:ro
      - ./dashboards/log-search.json:/var/lib/grafana/dashboards/log-search.json:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    cpus: ${MONITORING_CPUS:-0.5}
    mem_limit: ${MONITORING_MEM_LIMIT:-512m}
    networks:
      - monitoring
    labels:
      <<: *default-labels
    logging: *default-logging

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v2.42.0}
    container_name: prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--log.level=error'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.external-url=http://localhost:9090'
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./configs/prometheus/recording-rules.yml:/etc/prometheus/recording-rules.yml
      - ./configs/prometheus/alerting-rules.yml:/etc/prometheus/alerting-rules.yml
      - prometheus-data:/prometheus
    depends_on:
      - alertmanager
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    cpus: ${MONITORING_CPUS:-0.5}
    mem_limit: ${MONITORING_MEM_LIMIT:-512m}
    networks:
      - monitoring
    labels:
      <<: *default-labels
    logging: *default-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_VERSION:-v0.46.0}
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock
    cpus: ${MONITORING_CPUS:-0.5}
    mem_limit: ${MONITORING_MEM_LIMIT:-512m}
    networks:
      - monitoring
    labels:
      <<: *default-labels
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION:-v1.5.0}
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points'
      - "^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)"
    cpus: ${MONITORING_CPUS:-0.5}
    mem_limit: ${MONITORING_MEM_LIMIT:-512m}
    networks:
      - monitoring
    labels:
      <<: *default-labels
    logging: *default-logging

  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_VERSION:-v0.25.0}
    restart: unless-stopped
    container_name: alertmanager
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--log.level=error'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    volumes:
      - ./configs/alertmanager/alertmanager-fallback-config.yml:/etc/alertmanager/config.yml
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    cpus: ${MONITORING_CPUS:-0.5}
    mem_limit: ${MONITORING_MEM_LIMIT:-512m}
    networks:
      - monitoring
    depends_on:
      - uncomplicated-alert-receiver
    labels:
      <<: *default-labels
    logging: *default-logging

  uncomplicated-alert-receiver:
    image: ghcr.io/jamesread/uncomplicated-alert-receiver
    container_name: uncomplicated-alert-receiver
    restart: unless-stopped
    ports:
      - "${ALERT_RECEIVER_PORT:-9094}:8080"
    cpus: ${MONITORING_CPUS:-0.5}
    mem_limit: ${MONITORING_MEM_LIMIT:-512m}
    networks:
      - monitoring
    labels:
      <<: *default-labels
    logging: *default-logging

  redis:
    image: redis:${REDIS_VERSION:-6}
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    cpus: ${MONITORING_CPUS:-0.5}
    mem_limit: ${MONITORING_MEM_LIMIT:-512m}
    networks:
      - monitoring
    labels:
      <<: *default-labels
    logging: *default-logging

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    container_name: loki
    user: root
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./configs/loki/loki.yaml:/etc/loki/loki.yaml
      - ./configs/loki/rules.yaml:/etc/loki/rules/fake/loki-rules.yml
      - loki-data:/loki
    cpus: ${MONITORING_CPUS:-0.5}
    mem_limit: ${MONITORING_MEM_LIMIT:-512m}
    networks:
      - monitoring
    labels:
      <<: *default-labels
    logging: *default-logging

  promtail:
      image: grafana/promtail:3.3.2
      container_name: promtail
      restart: unless-stopped
      user: root
      volumes:
        - ./configs/promtail/promtail.yaml:/etc/promtail/docker-config.yaml
        - /var/lib/docker/containers:/var/lib/docker/containers:ro
        - /var/run/docker.sock:/var/run/docker.sock
      command: -config.file=/etc/promtail/docker-config.yaml
      depends_on:
        - loki
      cpus: ${MONITORING_CPUS:-0.5}
      mem_limit: ${MONITORING_MEM_LIMIT:-512m}
      networks:
        - monitoring
      labels:
        <<: *default-labels
      logging: *default-logging

volumes:
  grafana-data:
    name: ${GRAFANA_DATA_VOLUME:-monitoring-stack-gpnc_grafana-data}
    external: true
  prometheus-data:
    name: ${PROMETHEUS_DATA_VOLUME:-monitoring-stack-gpnc_prometheus-data}
    external: true
  loki-data:
    name: ${LOKI_DATA_VOLUME:-monitoring-stack-gpnc_loki-data}
    external: true

networks:
  monitoring:
    name: monitoring
