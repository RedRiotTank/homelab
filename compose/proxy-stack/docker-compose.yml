version: '3.8'

services:
  nginx-proxy:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - '${NPM_HTTP_PORT:-80}:80'
      - '${NPM_HTTPS_PORT:-443}:443'
      - '${NPM_ADMIN_PORT:-81}:81'
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
      - ./custom-pages:/var/www/custom-pages:ro
    networks:
      - proxy_net

  cloudflare-ddns:
    image: oznu/cloudflare-ddns:latest
    container_name: cloudflare-ddns
    restart: unless-stopped
    environment:
      - API_KEY=${CF_API_TOKEN}
      - ZONE=${CF_ZONE}
      - PROXIED=${CF_PROXIED}
      - CRON=${CF_CRON}
    networks:
      - proxy_net

  theme-compiler:
    image: node:alpine
    restart: unless-stopped
    volumes:
      - ./custom-pages:/themes
    working_dir: /themes
    command: >
      sh -c "npm install -g sass &&
             sass --watch .:. --no-source-map"
        
  theme-manager:
    image: node:alpine
    restart: unless-stopped
    volumes:
      - ./custom-pages:/themes
      - ./theme-manager:/app
    working_dir: /app
    command: node server.js
    ports:
      - "8082:3000"
networks:
  proxy_net:
    external: true
